<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konto erstellen – Vendoo</title><link rel="stylesheet" href="styles.css?v=vendoo02"><script src="app.js?v=vendoo02" defer></script></head><body><header class="header"><a class="logo" href="index.html">vendoo<span>.</span></a><nav class="nav"><a href="index.html">Zurück zum Marktplatz</a></nav></header><main class="page-wrap"><div class="form-card"><p class="kicker">NEU BEI VENDOO</p><h1>Erstelle dein Konto.</h1><p>Ein Konto für deine Merkliste und alle weiteren Marktplatz-Funktionen.</p><form id="auth-form"><div class="field"><label for="name">Name</label><input id="name" autocomplete="name" required></div><div class="field"><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Passwort</label><input id="password" type="password" autocomplete="new-password" minlength="8" required></div><div id="form-notice" class="notice error" hidden></div><button class="form-submit">Konto erstellen</button></form><div class="form-switch">Du hast schon ein Konto? <a href="login.html">Anmelden</a></div><p class="form-note">Die Registrierung ist noch nicht mit einem Backend verbunden. Zugangsdaten werden nicht gespeichert.</p></div></main></body></html>
